<title>Fruit in Season</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* Layout: one centered column, a fruit-stand legend up front, one question per screen, a single big fruit-colored reveal at the end. */
  :root {
    --bg: #FFF5F2;
    --surface: #FFFFFF;
    --ink: #2A1722;
    --muted: #6B525D;
    --line: #F0D6D3;
    --track: #F4E4E1;
    --accent: #D6304A;
    --accent-ink: #FFFFFF;
    --sel: #FFE6E3;
    --focus: #3F5FBF;
    --font-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1119; --surface: #2A1B26; --ink: #FBEEF1; --muted: #C7AAB4; --line: #4A3441;
      --track: #3A2832; --accent: #FF6279; --accent-ink: #2B0910; --sel: #4A2432; --focus: #8FA8FF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1119; --surface: #2A1B26; --ink: #FBEEF1; --muted: #C7AAB4; --line: #4A3441;
    --track: #3A2832; --accent: #FF6279; --accent-ink: #2B0910; --sel: #4A2432; --focus: #8FA8FF;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 22px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
  p { margin: 0; }

  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  h1 {
    font-weight: 800; font-size: clamp(34px, 9.5vw, 50px); line-height: 1.02; letter-spacing: -.02em;
    margin: 10px 0 14px;
  }
  .lede { color: var(--muted); font-size: 17px; max-width: 46ch; }

  /* Buttons */
  .btn {
    min-height: 52px; padding: 0 26px; border: 2px solid transparent; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    font: 700 16px/1 var(--font-body); cursor: pointer;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .fine { font-size: 14px; color: var(--muted); }

  /* Intro legend */
  .legend { list-style: none; padding: 0; margin: 26px 0 26px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile {
    background: var(--surface);
    background: color-mix(in srgb, var(--c) 14%, var(--surface));
    color: var(--ink); border: 1px solid var(--line);
    border: 1px solid color-mix(in srgb, var(--c) 32%, var(--line));
    border-radius: 14px; padding: 12px 4px 10px;
    text-align: center; display: grid; justify-items: center; gap: 2px; min-width: 0;
  }
  .tile b { font: 700 14px/1.2 var(--font-display); }
  .tile span { font-size: 12px; color: var(--muted); }

  /* Quiz */
  .meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .segs { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-bottom: 26px; }
  .seg { height: 8px; border-radius: 4px; background: var(--track); }
  .seg.done { background: var(--c); }
  .seg.now { background: var(--muted); opacity: .6; }
  h2.q { font-weight: 700; font-size: clamp(24px, 6.4vw, 30px); line-height: 1.15; letter-spacing: -.01em; margin-bottom: 20px; outline: none; }
  .opts { display: grid; gap: 10px; margin-bottom: 24px; }
  .opt {
    position: relative; display: flex; gap: 12px; align-items: flex-start;
    padding: 14px 16px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r);
    cursor: pointer; font-weight: 500; line-height: 1.4;
  }
  .opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); margin-top: 1px; }
  .opt.on { border-color: var(--accent); background: var(--sel); }
  .opt.on .dot { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 4px var(--sel); }
  .nav { display: flex; justify-content: space-between; gap: 10px; }

  /* Result */
  .hero {
    background: var(--c); color: var(--on); border-radius: 22px; padding: 24px 20px 22px;
    display: grid; gap: 6px; justify-items: start;
  }
  .hero .badge { background: rgba(255,255,255,.92); border-radius: 50%; width: 96px; height: 96px; display: grid; place-items: center; margin-bottom: 8px; }
  .hero .eyebrow { color: inherit; opacity: .85; }
  .hero h2 { font-weight: 800; font-size: clamp(42px, 13vw, 60px); line-height: 1; letter-spacing: -.02em; outline: none; }
  .hero .sub { font: 600 18px/1.3 var(--font-display); }
  .hero .blurb { margin-top: 8px; max-width: 46ch; }
  .stack { display: grid; gap: 14px; margin-top: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .card h3 { font-weight: 700; font-size: 20px; margin-bottom: 8px; }
  .card ul.tips { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .verse { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin-bottom: 6px; }
  .verse b { font-family: var(--font-display); }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chip {
    display: flex; gap: 10px; align-items: center; min-width: 0;
    background: var(--surface);
    background: color-mix(in srgb, var(--c) 14%, var(--surface));
    color: var(--ink); border: 1px solid var(--line);
    border: 1px solid color-mix(in srgb, var(--c) 32%, var(--line));
    border-radius: 14px; padding: 10px 12px;
  }
  .chip b { font: 700 16px/1.15 var(--font-display); display: block; }
  .chip span { font-size: 13px; color: var(--muted); }
  .chip > div { min-width: 0; }
  .bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .bh { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-weight: 600; font-size: 15px; }
  .bh .pct { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
  .track { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 5px; background: var(--c); transform-origin: left; }
  .note { font-size: 14px; color: var(--muted); }
  textarea#fallback { width: 100%; margin-top: 10px; min-height: 84px; font: 14px/1.4 var(--font-body); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px; }

  @media (prefers-reduced-motion: no-preference) {
    .screen { animation: rise .35s ease both; }
    .track i { animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes grow { from { transform: scaleX(0); } }
  }
</style>

<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<main class="wrap">

  <section id="intro" class="screen">
    <p class="eyebrow">Galatians 5:22–23</p>
    <h1>Which fruit is in season for you?</h1>
    <p class="lede">Ten questions about the last few weeks. Answer by instinct, and you’ll see which of the nine fruits of the Spirit is ripening in your life right now.</p>
    <ul class="legend" id="legend" aria-label="The nine fruits"></ul>
    <div class="row">
      <button class="btn" id="start" type="button">Start the quiz</button>
      <span class="fine">About three minutes. Nothing is saved.</span>
    </div>
  </section>

  <section id="quiz" class="screen" hidden>
    <div class="meta">
      <span class="eyebrow" id="count">Question 1 of 10</span>
    </div>
    <div class="segs" id="segs" aria-hidden="true"></div>
    <h2 class="q" id="qtext" tabindex="-1"></h2>
    <div class="opts" id="opts" role="group" aria-labelledby="qtext"></div>
    <div class="nav">
      <button class="btn ghost" id="back" type="button">Back</button>
      <button class="btn" id="next" type="button" disabled>Next</button>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <div class="hero" id="hero"></div>
    <div class="stack" id="details"></div>
  </section>

</main>

<script>
(function () {
  var LEAF = '#4C9A2A';

      verse: 'James 5:7–8', ask: 'What are you waiting on, and how might God be working inside the waiting?',
      step: 'Pause ten seconds before reacting today.' },
    { id: 'kindness', name: 'Kindness', fruit: 'Peach', c: '#F28C7A', on: '#3A1410',
      line: 'Soft, practical care is flowing out of you.',
      season: 'You’ve been noticing what people need and meeting it quietly, often without being asked. Kindness is ripening when your care becomes something another person can actually feel and use.',
      tend: ['Do one small, unseen favor each day.', 'Text someone who crossed your mind.', 'Assume the best about the next person who annoys you.'],
      verse: 'Ephesians 4:32', ask: 'Who could use an unexpected act of care this week?',
      step: 'Send one encouraging message today.' },
    { id: 'goodness', name: 'Goodness', fruit: 'Green apple', c: '#6DB33F', on: '#12260A',
      line: 'Your private life is lining up with your public one.',
      season: 'You’re choosing what’s right even when it costs you and no one is watching. Goodness is growing as integrity becomes less of a struggle and more of who you are.',
      tend: ['Keep one promise you’ve been quietly putting off.', 'Say the honest thing, and say it kindly.', 'Give generously in a way no one will notice.'],
      verse: 'Galatians 6:9–10', ask: 'Where is God inviting you to be the same person in private as in public?',
      step: 'Follow through on one thing you said you’d do.' },
    { id: 'faithfulness', name: 'Faithfulness', fruit: 'Fig', c: '#7A4A3A', on: '#FFFFFF',

  ];
  var BY = {};

  /* Each option: [text, primary fruit (2 pts), secondary fruit (1 pt)] */
  var Q = [
    { q: 'Over the last few weeks, what has your heart been doing most?', o: [

    { q: 'Which of these has taken the most effort lately?', o: [

      ['Slow mornings with no rushing', 'peace', 'gentleness'] ] },
    { q: 'Someone who is struggling says something sharp to you. What’s your instinct?', o: [

      ['Stay close anyway, because sharp words are often pain talking', 'love', 'patience'],
      ['Do something practical to help, without a speech', 'kindness', 'goodness'],
      ['Pause and breathe before I answer', 'selfcontrol', 'patience'] ] },
    { q: 'Which sentence sounds most like your inner voice this season?', o: [
      ['God has been faithful, so I’ll keep going', 'faithfulness', 'joy'],

  FRUITS.forEach(function (f) { MAX[f.id] = 0; });

    patience: '<path d="M32 22c0-6 2-9 5-12" stroke="#5B3B24" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M37 12c6-5 13-3 15 1-6 4-12 3-15-1z" fill="' + LEAF + '"/><circle cx="32" cy="40" r="19" fill="#7A3E8E"/><path d="M32 22c-5 10-5 26 0 37" stroke="#552765" stroke-width="2.2" stroke-linecap="round" fill="none"/><ellipse cx="22" cy="36" rx="3" ry="6" fill="#fff" opacity=".22" transform="rotate(15 22 36)"/>',
    kindness: '<path d="M32 22C20 14 8 24 12 40c3 12 14 18 20 16 6 2 17-4 20-16 4-16-8-26-20-18z" fill="#F28C7A"/><path d="M32 22c-4 10-3 24 1 34" stroke="#D2604F" stroke-width="2.2" stroke-linecap="round" fill="none"/><ellipse cx="46" cy="36" rx="5" ry="9" fill="#F9B6A6" opacity=".6"/><path d="M33 20c0-5 2-8 4-9" stroke="#5B3B24" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M37 12c6-5 14-3 16 1-6 4-13 4-16-1z" fill="' + LEAF + '"/>',
    goodness: '<path d="M32 24C24 15 10 21 12 37c1 12 10 22 20 18 10 4 19-6 20-18 2-16-12-22-20-13z" fill="#6DB33F"/><path d="M32 24c0-6 2-10 5-13" stroke="#5B3B24" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M37 14c6-5 13-3 15 1-6 4-12 3-15-1z" fill="#3F7F22"/><ellipse cx="22" cy="34" rx="3.2" ry="7" fill="#fff" opacity=".28" transform="rotate(15 22 34)"/>',
    faithfulness: '<path d="M32 14c8 0 18 16 18 28 0 10-8 16-18 16S14 52 14 42c0-12 10-28 18-28z" fill="#7A4A3A"/><path d="M26 30c0 9 2 18 6 27M38 30c0 9-2 18-6 27" stroke="#55301F" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M32 14V8" stroke="#5B3B24" stroke-width="3" stroke-linecap="round"/><ellipse cx="23" cy="40" rx="2.6" ry="6.5" fill="#fff" opacity=".2" transform="rotate(10 23 40)"/>',
    gentleness: '<path d="M32 12c6 0 8 8 8 14 0 5 6 8 8 16 2 10-6 16-16 16S14 52 16 42c2-8 8-11 8-16 0-6 2-14 8-14z" fill="#B7C467"/><path d="M32 12c0-3 1-5 3-7" stroke="#5B3B24" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M35 8c5-4 11-2 13 1-5 3-10 3-13-1z" fill="' + LEAF + '"/><ellipse cx="42" cy="46" rx="4" ry="7" fill="#D9E19A" opacity=".6"/><ellipse cx="25" cy="44" rx="2.6" ry="6" fill="#fff" opacity=".28" transform="rotate(12 25 44)"/>',
    selfcontrol: '<circle cx="32" cy="37" r="21" fill="#E8711A"/><g fill="#BF5206"><circle cx="22" cy="34" r="1.1"/><circle cx="30" cy="44" r="1.1"/><circle cx="41" cy="38" r="1.1"/><circle cx="36" cy="30" r="1.1"/><circle cx="25" cy="48" r="1.1"/><circle cx="44" cy="48" r="1.1"/></g><path d="M32 16c0-3 1-5 2-6" stroke="#5B3B24" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M34 14c6-6 14-4 17 0-6 5-13 5-17 0z" fill="' + LEAF + '"/><ellipse cx="22" cy="30" rx="3.2" ry="6.5" fill="#fff" opacity=".26" transform="rotate(18 22 30)"/>'
  };
  function icon(id, size) {
    return '<svg viewBox="0 0 64 64" width="' + size + '" height="' + size + '" aria-hidden="true" focusable="false">' + ICONS[id] + '</svg>';
  }

  /* Elements */
  var $ = function (id) { return document.getElementById(id); };
  var intro = $('intro'), quiz = $('quiz'), result = $('result');
  var idx = 0, answers = [];

  function show(el) {
    [intro, quiz, result].forEach(function (s) { s.hidden = (s !== el); });
    window.scrollTo(0, 0);
  }

  /* Intro legend */
  $('legend').innerHTML = FRUITS.map(function (f) {
    return '<li class="tile" style="--c:' + f.c + ';--on:' + f.on + '">' + icon(f.id, 40) + '<b>' + f.name + '</b><span>' + f.fruit + '</span></li>';
  }).join('');

  /* Quiz */
  function renderQuestion() {
    var q = Q[idx];
    $('count').textContent = 'Question ' + (idx + 1) + ' of ' + Q.length;
    $('segs').innerHTML = Q.map(function (_, i) {
      var cls = i < idx ? 'seg done' : (i === idx ? 'seg now' : 'seg');
      return '<span class="' + cls + '" style="--c:' + FRUITS[i % FRUITS.length].c + '"></span>';
    }).join('');
    $('qtext').textContent = q.q;
    $('opts').innerHTML = q.o.map(function (o, i) {
      var on = answers[idx] === i;
      return '<label class="opt' + (on ? ' on' : '') + '"><input type="radio" name="q' + idx + '" value="' + i + '"' + (on ? ' checked' : '') + '><span class="dot"></span><span>' + o[0] + '</span></label>';
    }).join('');
    $('next').disabled = answers[idx] === undefined;
    $('next').textContent = idx === Q.length - 1 ? 'See my fruit' : 'Next';
    $('qtext').focus({ preventScroll: true });
  }

  $('opts').addEventListener('change', function (e) {
    if (e.target && e.target.type === 'radio') {
      answers[idx] = Number(e.target.value);
      Array.prototype.forEach.call($('opts').children, function (el, i) { el.classList.toggle('on', i === answers[idx]); });
      $('next').disabled = false;
    }
  });

  $('start').addEventListener('click', function () {
    idx = 0; answers = [];
    show(quiz); renderQuestion();
  });
  $('back').addEventListener('click', function () {
    if (idx === 0) { show(intro); return; }
    idx -= 1; renderQuestion();
  });
  $('next').addEventListener('click', function () {
    if (answers[idx] === undefined) return;
    if (idx < Q.length - 1) { idx += 1; renderQuestion(); }
    else { renderResult(); }
  });

  /* Result */
  var summaryText = '';
  function renderResult() {
    var r = score(answers);
    var top = r[0].f, second = r[1].f, third = r[2].f, last = r[r.length - 1].f;

    $('hero').style.setProperty('--c', top.c);
    $('hero').style.setProperty('--on', top.on);
    $('hero').innerHTML =
      '<div class="badge">' + icon(top.id, 72) + '</div>' +
      '<p class="eyebrow">The fruit in season for you</p>' +
      '<h2 id="rname" tabindex="-1">' + top.name + '</h2>' +
      '<p class="sub">' + top.fruit + ' season. ' + top.line + '</p>' +
      '<p class="blurb">' + top.season + '</p>';

    var chips = [second, third].map(function (f) {
      return '<div class="chip" style="--c:' + f.c + ';--on:' + f.on + '">' + icon(f.id, 36) + '<div><b>' + f.name + '</b><span>' + f.fruit + '</span></div></div>';
    }).join('');

    var bars = r.map(function (x) {
      var pct = Math.round(x.ratio * 100);
      return '<li style="--c:' + x.f.c + '"><div class="bh">' + icon(x.f.id, 22) + '<span>' + x.f.name + '</span><span class="pct">' + pct + '%</span></div><div class="track" role="img" aria-label="' + x.f.name + ' ' + pct + ' percent"><i style="width:' + pct + '%"></i></div></li>';
    }).join('');

    summaryText = 'The fruit of the Spirit in season for me right now: ' + top.name + ' (' + top.fruit + '). Also ripening: ' + second.name + ' and ' + third.name + '.';

    $('details').innerHTML =
      '<div class="card"><h3>How to tend it</h3><ul class="tips">' + top.tend.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul></div>' +
      '<div class="card"><h3>Sit with this</h3><p class="verse"><b>' + top.verse + '</b></p><p>' + top.ask + '</p></div>' +
      '<div class="card"><h3>Also ripening</h3><div class="chips">' + chips + '</div></div>' +
      '<div class="card"><h3>All nine, this season</h3><ul class="bars">' + bars + '</ul></div>' +
      '<div class="card"><h3>Waiting for its season</h3><p><b>' + last.name + '</b> had the least room this month. That isn’t a failing. Fruit ripens in its own time. ' + last.step + '</p></div>' +
      '<p class="note">This is a reflection tool, not a measure of your worth or maturity. The fruit is one fruit with nine flavors, and it grows by the Spirit, not by effort alone.</p>' +
      '<div class="row"><button class="btn" id="copy" type="button">Copy my result</button><button class="btn ghost" id="retake" type="button">Retake the quiz</button><span class="fine" id="copystatus" role="status"></span></div>' +
      '<textarea id="fallback" readonly hidden aria-label="Result text to copy"></textarea>';

    show(result);
    $('rname').focus({ preventScroll: true });
  }

  result.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.id) return;
    if (t.id === 'retake') { idx = 0; answers = []; show(intro); }
    if (t.id === 'copy') {
      var status = $('copystatus'), fb = $('fallback');
      var fallback = function () {
        fb.hidden = false; fb.value = summaryText; fb.focus(); fb.select();
        status.textContent = 'Press copy on your device.';
      };
      try {
        navigator.clipboard.writeText(summaryText).then(function () {
          status.textContent = 'Copied.'; fb.hidden = true;
        }, fallback);
      } catch (err) { fallback(); }
    }
  });
})();
</script>
</body>
</html>
